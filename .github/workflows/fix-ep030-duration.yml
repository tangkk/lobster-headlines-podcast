name: Fix Episode 030 Duration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-ep030-duration.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fix EP030 duration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('feed.xml')
          s = p.read_text(encoding='utf-8')
          marker = '<guid isPermaLink="false">ep030-ai-not-hiring</guid>'
          i = s.index(marker)
          j = s.index('<itunes:duration>', i)
          k = s.index('</itunes:duration>', j)
          old = s[j:k + len('</itunes:duration>')]
          if old != '<itunes:duration>00:00:00</itunes:duration>':
              raise SystemExit(f'Unexpected EP030 duration node: {old}')
          s = s[:j] + '<itunes:duration>00:06:14</itunes:duration>' + s[k + len('</itunes:duration>'):]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix and remove one-off workflows
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- feed.xml
          git rm -- .github/workflows/fix-ep030-duration.yml .github/workflows/publish-ep030.yml
          git commit -m 'Fix episode 30 duration metadata [skip ci]'
          git push

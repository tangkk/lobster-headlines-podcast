name: Publish Episode 030

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-ep030.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      XFYUN_APPID: ${{ secrets.XFYUN_APPID }}
      XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
      XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          python -m pip install --upgrade pip
          python -m pip install websocket-client boto3

      - name: Validate publish inputs
        shell: bash
        run: |
          grep -q '<guid>ep030-ai-not-hiring</guid>' feed.xml && { echo 'Episode 030 already exists in feed'; exit 1; } || true
          test -f episodes/ep030-ai-not-hiring.txt
          for v in XFYUN_APPID XFYUN_API_KEY XFYUN_API_SECRET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET R2_PUBLIC_URL; do
            test -n "${!v}" || { echo "Missing $v"; exit 1; }
          done
          mkdir -p build

      - name: Generate final segmented TTS
        run: |
          python scripts/xfyun-tools/xfyun_segmented_run.py \
            --text-file episodes/ep030-ai-not-hiring.txt \
            --out build/ep030-ai-not-hiring.mp3 \
            --profile default \
            --pause-ms 350

      - name: Resolve duration and metadata
        shell: bash
        run: |
          SECONDS=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 build/ep030-ai-not-hiring.mp3)
          DURATION=$(python -c 'import sys; s=round(float(sys.argv[1])); print(f"{s//3600:02d}:{(s%3600)//60:02d}:{s%60:02d}")' "$SECONDS")
          echo "DURATION=$DURATION" >> "$GITHUB_ENV"
          cat >> "$GITHUB_ENV" <<'EOF'
          DESCRIPTION<<DESC_EOF
          《龙虾头条》第三十期。企业越来越公开把裁员和人工智能联系起来，但真正更早出现的就业冲击，可能不是 firing，而是 not hiring。宏观失业数据还没有显示大规模 AI 替代，年轻人进入白领职场的入口却可能正在变窄。

          文字版阅读：
          https://tangkk.github.io/lobster-headlines/posts/2026-08-20-ai-not-hiring/
          DESC_EOF
          EOF

      - name: Upload to R2 and update podcast feed
        run: |
          python scripts/publish_episode.py \
            --audio build/ep030-ai-not-hiring.mp3 \
            --slug ep030-ai-not-hiring \
            --title 'AI 抢走的第一批工作，可能根本没人被裁' \
            --description "$DESCRIPTION" \
            --duration "$DURATION" \
            --prefix headlines

      - name: Commit updated feed
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- feed.xml
          git diff --cached --quiet && { echo 'No feed change to commit'; exit 1; }
          git commit -m 'Publish episode 30 [skip ci]'
          git push
